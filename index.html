<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stats</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;background:#101114;color:#f5f5f5}main{max-width:1050px;margin:auto;padding:20px}h1{font-size:52px;margin:0 0 20px}.muted{color:#b7bac3;margin-bottom:22px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}input,select{background:#1a1d23;color:#fff;border:1px solid #343945;border-radius:10px;padding:10px}table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid #30343d;text-align:right}th:first-child,td:first-child{text-align:left}.cid{display:block;color:#8d93a1;font-size:12px;margin-top:3px}.positive{color:#7ee787;font-weight:700}.negative{color:#ff7b72}.stale{color:#e3b341}.error{color:#ff7b72}@media(max-width:650px){main{padding:18px 14px}h1{font-size:48px}th,td{padding:11px 6px}}

.comparebox{
  margin:20px 0;
  padding:14px;
  background:#fff;
  color:#111;
  border-radius:14px;
}

.compare-controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.compare-controls select,
.bot-picker{
  flex:1;
  min-width:120px;
}

.bot-picker{
  background:#1a1d23;
  color:#fff;
  border:1px solid #343945;
  border-radius:10px;
  padding:10px;
}

.bot-picker summary{
  cursor:pointer;
}

#compareBots{
  max-height:250px;
  overflow-y:auto;
  margin-top:10px;
}

#compareBots label{
  display:block;
  padding:6px 2px;
}

#compareChart{
  height:340px !important;
}

.compare-table{
  margin-top:18px;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body><main><h1>stats</h1><div id="updated" class="muted">Laden…</div>
<div class="controls"><input id="search" placeholder="Search bot"><select id="sort"><option value="creation">Date</option><option value="growth">Growth</option><option value="messages">Messages</option><option value="collectors">Meeste collectors</option><option value="name">Alfabetisch</option></select></div>

<div class="comparebox">
  <div class="compare-controls">
    <select id="compareMetric">
      <option value="messages">Messages</option>
      <option value="collectors">Collectors</option>
    </select>

    <select id="comparePeriod">
      <option value="all">All</option>
      <option value="30">30 day</option>
      <option value="7">7 day</option>
    </select>

    <details class="bot-picker">
      <summary id="compareSummary">Bots</summary>
      <div id="compareBots"></div>
    </details>
  </div>

  <canvas id="compareChart"></canvas>

  <table class="compare-table">
    <thead>
      <tr>
        <th>Bot</th>
        <th>Start</th>
        <th>Now</th>
        <th>Grow</th>
      </tr>
    </thead>
    <tbody id="compareRows"></tbody>
  </table>
</div>
<table><thead><tr><th>Bot</th><th>Messages</th><th>Δ</th><th>C.</th></tr></thead><tbody id="rows"></tbody></table></main>
<script>
const fmt=new Intl.NumberFormat('nl-NL');
const state={bots:[],meta:new Map(),history:null};
let compareChart=null;
Promise.all([fetch('bots.json',{cache:'no-store'}).then(r=>r.json()),fetch('data/history.json',{cache:'no-store'}).then(r=>r.json())]).then(([bots,history])=>{
 state.history=history;
 bots.forEach(b=>state.meta.set(b.cid,b));
 const latest=history.snapshots.at(-1), previous=history.snapshots.at(-2);
 const prev=new Map((previous?.bots||[]).map(b=>[b.cid,b]));
 state.bots=(latest?.bots||[]).map(b=>{const m=state.meta.get(b.cid)||{};return {...b,name:m.name||b.name,url:m.url||b.url,order:m.creation_order??9999,growth:Number.isFinite(b.messages)&&Number.isFinite(prev.get(b.cid)?.messages)?b.messages-prev.get(b.cid).messages:null}});
 document.querySelector('#updated').textContent='Laatste meting: '+new Date(latest.timestamp).toLocaleString('nl-NL');

const compareBots=document.querySelector('#compareBots');

compareBots.innerHTML=[...bots]
  .sort((a,b)=>(b.creation_order??9999)-(a.creation_order??9999))
  .map(b=>`
    <label>
      <input type="checkbox" value="${b.cid}">
      ${b.cid}
    </label>
  `)
  .join('');

render();
}).catch(e=>document.querySelector('#updated').textContent='Fout: '+e.message);
function render(){const q=document.querySelector('#search').value.toLowerCase(),s=document.querySelector('#sort').value;let a=state.bots.filter(b=>(b.name+' '+b.cid).toLowerCase().includes(q));a.sort((x,y)=>s==='growth'?(y.growth??-Infinity)-(x.growth??-Infinity):s==='messages'?(y.messages??-Infinity)-(x.messages??-Infinity):s==='collectors'?(y.collectors??-Infinity)-(x.collectors??-Infinity):s==='name'?x.name.localeCompare(y.name):y.order-x.order);document.querySelector('#rows').innerHTML=a.map(b=>`<tr><td><a href="${b.url}" target="_blank" style="color:inherit;text-decoration:none">${b.cid}</a></td><td class="${b.stale?'stale':''}">${b.messages==null?'—':fmt.format(b.messages)}</td><td class="${b.growth>0?'positive':b.growth<0?'negative':''}">${b.growth==null?'—':(b.growth>0?'+':'')+fmt.format(b.growth)}</td><td>${b.collectors==null?'—':fmt.format(b.collectors)}</td></tr>`).join('')}
document.querySelector('#search').addEventListener('input',render);document.querySelector('#sort').addEventListener('change',render);

function drawCompareChart(){
  const metric=document.querySelector('#compareMetric').value;
  const period=document.querySelector('#comparePeriod').value;

  const selected=[...document.querySelectorAll('#compareBots input:checked')]
    .map(i=>i.value);

  document.querySelector('#compareSummary').textContent=
    selected.length===0
      ? 'Bots'
      : selected.length+' bots selected';

  if(compareChart){
    compareChart.destroy();
    compareChart=null;
  }

  document.querySelector('#compareRows').innerHTML='';

  if(selected.length===0 || !state.history) return;

  let snapshots=[...state.history.snapshots];

  if(period!=='all'){
    const cutoff=Date.now()-(Number(period)*24*60*60*1000);
    snapshots=snapshots.filter(
      s=>new Date(s.timestamp).getTime()>=cutoff
    );
  }

  const daily=new Map();

  snapshots.forEach(s=>{
    const date=new Date(s.timestamp);
    const key=date.toLocaleDateString('sv-SE');
    daily.set(key,s);
  });

  const days=[...daily.values()];

  const labels=days.map(s=>
    new Date(s.timestamp).toLocaleDateString('nl-NL',{
      day:'2-digit',
      month:'2-digit',
      year:'2-digit'
    })
  );

  const datasets=selected.map(cid=>{
    const values=days.map(s=>{
      const bot=(s.bots||[]).find(b=>b.cid===cid);
      return bot && Number.isFinite(bot[metric])
        ? bot[metric]
        : null;
    });

    return {
      label:cid,
      data:values,
      tension:0.2,
      spanGaps:true
    };
  });

  compareChart=new Chart(
    document.querySelector('#compareChart'),
    {
      type:'line',
      data:{
        labels,
        datasets
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        interaction:{
          intersect:false,
          mode:'index'
        },
        scales:{
          y:{
            ticks:{
              callback:value=>fmt.format(value)
            }
          }
        }
      }
    }
  );

  document.querySelector('#compareRows').innerHTML=
    selected.map(cid=>{
      const values=days
        .map(s=>{
          const bot=(s.bots||[]).find(b=>b.cid===cid);
          return bot && Number.isFinite(bot[metric])
            ? bot[metric]
            : null;
        })
        .filter(v=>v!==null);

      if(!values.length){
        return `
          <tr>
            <td>${cid}</td>
            <td>—</td>
            <td>—</td>
            <td>—</td>
          </tr>
        `;
      }

      const start=values[0];
      const current=values.at(-1);
      const growth=current-start;

      return `
        <tr>
          <td>${cid}</td>
          <td>${fmt.format(start)}</td>
          <td>${fmt.format(current)}</td>
          <td class="${growth>0?'positive':growth<0?'negative':''}">
            ${growth>0?'+':''}${fmt.format(growth)}
          </td>
        </tr>
      `;
    })
    .join('');
}

document.querySelector('#compareMetric')
  .addEventListener('change',drawCompareChart);

document.querySelector('#comparePeriod')
  .addEventListener('change',drawCompareChart);

document.querySelector('#compareBots')
  .addEventListener('change',drawCompareChart);
</script></body></html>
