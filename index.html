<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>stats</title><style>body{font-family:system-ui;background:#101114;color:#fff;margin:0;padding:18px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #333;text-align:right}th:first-child,td:first-child{text-align:left}</style><h1>stats</h1><p id="u">Laden…</p><table><thead><tr><th>Bot</th><th>Messages</th><th>Δ</th><th>Collectors</th></tr></thead><tbody id="r"></tbody></table><script>Promise.all([fetch("bots.json").then(r=>r.json()),fetch("data/history.json",{cache:"no-store"}).then(r=>r.json())]).then(([b,h])=>{const a=h.snapshots.at(-1),p=h.snapshots.at(-2),pm=new Map((p?.bots||[]).map(x=>[x.name,x]));u.textContent="Laatste meting: "+new Date(a.timestamp).toLocaleString("nl-NL");r.innerHTML=a.bots.map(x=>{const d=(x.messages!=null&&pm.get(x.name)?.messages!=null)?x.messages-pm.get(x.name).messages:null;return `<tr><td>${x.name}</td><td>${x.messages?.toLocaleString("nl-NL")??"—"}</td><td>${d==null?"—":(d>0?"+":"")+d.toLocaleString("nl-NL")}</td><td>${x.collectors?.toLocaleString("nl-NL")??"—"}</td></tr>`}).join("")}).catch(e=>u.textContent=e.message)</script></html>
