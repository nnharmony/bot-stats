<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stats</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;background:#101114;color:#f5f5f5}main{max-width:1050px;margin:auto;padding:20px}h1{font-size:52px;margin:0 0 20px}.muted{color:#b7bac3;margin-bottom:22px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}input,select{background:#1a1d23;color:#fff;border:1px solid #343945;border-radius:10px;padding:10px}table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid #30343d;text-align:right}th:first-child,td:first-child{text-align:left}.cid{display:block;color:#8d93a1;font-size:12px;margin-top:3px}.positive{color:#7ee787;font-weight:700}.negative{color:#ff7b72}.stale{color:#e3b341}.error{color:#ff7b72}@media(max-width:650px){main{padding:18px 14px}h1{font-size:48px}th,td{padding:11px 6px}}
</style>
</head>
<body><main><h1>stats</h1><div id="updated" class="muted">Laden…</div>
<div class="controls"><input id="search" placeholder="Zoek naam of CID"><select id="sort"><option value="creation">Creatievolgorde</option><option value="growth">Grootste groei</option><option value="messages">Meeste messages</option><option value="collectors">Meeste collectors</option><option value="name">Alfabetisch</option></select></div>
<table><thead><tr><th>Bot</th><th>Messages</th><th>Δ</th><th>C.</th></tr></thead><tbody id="rows"></tbody></table></main>
<script>
const fmt=new Intl.NumberFormat('nl-NL');const state={bots:[],meta:new Map()};
Promise.all([fetch('bots.json',{cache:'no-store'}).then(r=>r.json()),fetch('data/history.json',{cache:'no-store'}).then(r=>r.json())]).then(([bots,history])=>{
 bots.forEach(b=>state.meta.set(b.cid,b));
 const latest=history.snapshots.at(-1), previous=history.snapshots.at(-2);
 const prev=new Map((previous?.bots||[]).map(b=>[b.cid,b]));
 state.bots=(latest?.bots||[]).map(b=>{const m=state.meta.get(b.cid)||{};return {...b,name:m.name||b.name,url:m.url||b.url,order:m.creation_order??9999,growth:Number.isFinite(b.messages)&&Number.isFinite(prev.get(b.cid)?.messages)?b.messages-prev.get(b.cid).messages:null}});
 document.querySelector('#updated').textContent='Laatste meting: '+new Date(latest.timestamp).toLocaleString('nl-NL');render();
}).catch(e=>document.querySelector('#updated').textContent='Fout: '+e.message);
function render(){const q=document.querySelector('#search').value.toLowerCase(),s=document.querySelector('#sort').value;let a=state.bots.filter(b=>(b.name+' '+b.cid).toLowerCase().includes(q));a.sort((x,y)=>s==='growth'?(y.growth??-Infinity)-(x.growth??-Infinity):s==='messages'?(y.messages??-Infinity)-(x.messages??-Infinity):s==='collectors'?(y.collectors??-Infinity)-(x.collectors??-Infinity):s==='name'?x.name.localeCompare(y.name):x.order-y.order);document.querySelector('#rows').innerHTML=a.map(b=>`<tr><td><a href="${b.url}" target="_blank" style="color:inherit;text-decoration:none">${b.cid}</a></td><td class="${b.stale?'stale':''}">${b.messages==null?'—':fmt.format(b.messages)}</td><td class="${b.growth>0?'positive':b.growth<0?'negative':''}">${b.growth==null?'—':(b.growth>0?'+':'')+fmt.format(b.growth)}</td><td>${b.collectors==null?'—':fmt.format(b.collectors)}</td></tr>`).join('')}
document.querySelector('#search').addEventListener('input',render);document.querySelector('#sort').addEventListener('change',render);
</script></body></html>
