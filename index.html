<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stats</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}
body{margin:0;background:#101114;color:#f5f5f5}
main{max-width:1050px;margin:auto;padding:20px}
h1{font-size:52px;margin:0 0 20px}
.muted{color:#b7bac3;margin-bottom:22px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
input,select,button{background:#1a1d23;color:#fff;border:1px solid #343945;border-radius:10px;padding:10px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 10px;border-bottom:1px solid #30343d;text-align:right}
th:first-child,td:first-child{text-align:left}
.cid{display:block;color:#8d93a1;font-size:12px;margin-top:3px}
.positive{color:#7ee787;font-weight:700}
.negative{color:#ff7b72}
.stale{color:#e3b341}
.error{color:#ff7b72}

.all-bots{
  margin:0 0 20px;
  border:1px solid #30343d;
  border-radius:12px;
  background:#15171c;
}

.all-bots summary{
  cursor:pointer;
  padding:12px 14px;
  font-size:14px;
  font-weight:700;
}

.all-bots-content{
  padding:0 12px 12px;
}

.comparebox{
  margin:20px 0;
  padding:14px;
  background:#fff;
  color:#111;
  border-radius:14px;
}

.date-labels{
  display:grid;
  grid-template-columns:1fr 1fr 0.8fr;
  gap:8px;
  margin-bottom:4px;
  text-align:center;
  font-size:12px;
  color:#555;
}

.date-controls{
  display:grid;
  grid-template-columns:1fr 1fr 0.8fr;
  gap:8px;
  margin-bottom:8px;
}

.date-controls button,
.date-box{
  min-width:0;
  height:35px;
  box-sizing:border-box;
  border:1px solid #343945;
  border-radius:10px;
  background:#1a1d23;
}

.date-controls button{
  width:100%;
  padding:0 6px;
}

.date-box{
  display:flex;
  align-items:center;
  padding:0 6px;
}

.date-box input[type="date"]{
  display:block;
  width:100%;
  min-width:0;
  border:0;
  padding:0;
  margin:0;
  background:transparent;
  color:#fff;
  font-size:13px;
}

.compare-controls{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
  margin-bottom:12px;
}

.compare-controls select,
.compare-controls button{
  width:100%;
  min-width:0;
}

.bot-picker{
  background:#1a1d23;
  color:#fff;
  border:1px solid #343945;
  border-radius:10px;
  padding:10px;
}

.bot-picker summary{
  cursor:pointer;
  font-size:13px;
}

#compareBots{
  max-height:250px;
  overflow-y:auto;
  margin-top:10px;
}

#compareBots label{
  display:block;
  padding:6px 2px;
  font-size:13px;
}



.graph-event-filters{
  display:grid;
  grid-template-columns:repeat(9,minmax(0,1fr));
  gap:5px;
  width:100%;
  margin:3px 0 10px;
}
.graph-event-filter{
  width:100%;
  min-width:0;
  height:34px;
  padding:0 !important;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px !important;
  line-height:1;
  border-radius:9px;
}
.graph-event-filter.active{
  background:var(--ui-accent-1) !important;
  color:#18191c !important;
  border-color:var(--ui-accent-1) !important;
}

.chart-area{
  height:340px;
  position:relative;
}

#compareChart{
  width:100% !important;
  height:100% !important;
}

.compare-table{
  margin-top:18px;
  font-size:12px;
}

.main-table{
  font-size:13px;
}

.total-row td{
  font-weight:700;
  border-top:2px solid #f5f5f5;
}

@media(max-width:650px){
  main{padding:18px 14px}
  h1{font-size:48px}
  th,td{padding:11px 6px}
  .compare-table{font-size:12px}
  #compareBots label{font-size:12px}
  .bot-picker summary{font-size:12px}
  .main-table{font-size:12px}
  .all-bots summary{font-size:13px}
}

.events-panel{
  margin:20px 0;
  border-radius:14px;
  overflow:hidden;
  background:#fff;
  color:#111;
}

.events-panel>summary{
  cursor:pointer;
  padding:12px 14px;
  background:#1a1d23;
  color:#fff;
  border:1px solid #343945;
  border-radius:10px;
  font-size:13px;
  list-style-position:inside;
}

.events-panel[open]>summary{
  border-radius:10px 10px 0 0;
}

.events-content{
  padding:14px;
}

.events-lock{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:12px;
}

.events-lock input{
  flex:1;
  min-width:160px;
}

.events-status{
  font-size:12px;
  color:#666;
}

.events-status.ok{
  color:#2da44e;
  font-weight:700;
}

.events-status.error{
  color:#cf222e;
  font-weight:700;
}

#eventsPrivate[hidden]{
  display:none !important;
}

.event-form{
  display:grid;
  grid-template-columns:1fr 1.35fr;
  gap:10px;
}

.event-field{
  min-width:0;
}

.event-field label{
  display:block;
  font-size:12px;
  color:#555;
  margin:0 0 4px 2px;
}

.event-field input,
.event-field select,
.event-field textarea{
  width:100%;
  box-sizing:border-box;
}

.event-field textarea{
  min-height:70px;
  resize:vertical;
  font-family:inherit;
  background:#1a1d23;
  color:#fff;
  border:1px solid #343945;
  border-radius:10px;
  padding:10px;
}

.event-tags-wrap{
  grid-column:1/-1;
}

.event-tags{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.event-tag{
  border:1px solid #c8ccd3;
  background:#f4f5f7;
  color:#222;
  border-radius:999px;
  padding:7px 10px;
  cursor:pointer;
  font-size:12px;
}

.event-tag.active{
  background:#1a1d23;
  color:#fff;
  border-color:#1a1d23;
}

.event-actions{
  grid-column:1/-1;
  display:flex;
  gap:8px;
  align-items:center;
}

.event-actions button{
  min-width:90px;
}

#eventSaveStatus{
  font-size:12px;
  color:#666;
}

#eventSaveStatus.ok{
  color:#2da44e;
  font-weight:700;
}

#eventSaveStatus.error{
  color:#cf222e;
  font-weight:700;
}

.saved-events{
  margin-top:18px;
}

.saved-events h3{
  font-size:14px;
  margin:0 0 8px;
}

.saved-events table{
  font-size:12px;
}

.saved-events td,
.saved-events th{
  padding:8px 6px;
  border-bottom:1px solid #ddd;
}

.saved-events .event-note{
  text-align:left;
  max-width:260px;
  overflow-wrap:anywhere;
}

.saved-events .event-controls{
  white-space:nowrap;
}

.saved-events .event-controls button{
  padding:5px 7px;
  margin-left:4px;
  font-size:12px;
}

.tag-chip{
  display:inline-block;
  border-radius:999px;
  padding:2px 6px;
  margin:1px 2px 1px 0;
  background:#eef0f3;
  border:1px solid #d5d8de;
  font-size:11px;
  white-space:nowrap;
}

@media(max-width:650px){
  .event-form{
    grid-template-columns:1fr;
  }
  .event-tags-wrap,
  .event-actions{
    grid-column:1;
  }
  .saved-events{
    overflow-x:auto;
  }
  .saved-events table{
    min-width:620px;
  }
  .events-panel>summary{
    font-size:12px;
  }
}


#app[hidden]{
  display:none !important;
}

#siteGate[hidden]{
  display:none !important;
}

.site-gate{
  display:block;
  max-width:1050px;
  margin:0 auto;
  padding:18px 20px 0;
  box-sizing:border-box;
}

.site-gate-card{
  width:100%;
  background:#fff;
  color:#111;
  border-radius:14px;
  padding:12px 14px;
  box-sizing:border-box;
}

.site-gate-card h1{
  color:#111;
  font-size:28px;
  margin:0 0 10px;
  text-transform:lowercase;
}

.site-gate-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:8px;
}

.site-gate-row input{
  min-width:0;
  width:100%;
  height:38px;
  box-sizing:border-box;
  font-size:16px;
}

.site-gate-row button{
  height:38px;
  padding:0 14px;
}

#siteGateStatus{
  min-height:16px;
  margin-top:6px;
  font-size:11px;
  color:#666;
}

#siteGateStatus.error{
  color:#cf222e;
  font-weight:700;
}

.app-head-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:22px;
}

.app-head-row .muted{
  margin-bottom:0;
  flex:1;
}

#siteLockButton{
  padding:7px 10px;
  font-size:12px;
}

.events-panel>summary,
.events-content,
.events-content label,
.saved-events h3,
.saved-events th,
.event-tag,
#eventSave,
#eventClear{
  text-transform:lowercase;
}

#eventDate{
  text-align:left !important;
  direction:ltr;
  width:170px !important;
  max-width:170px;
  height:38px;
  padding:5px 8px;
  font-size:12px !important;
}

.event-tags{
  display:grid !important;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}

.event-tag{
  width:100%;
  min-width:0;
  padding:8px 10px;
  text-align:left;
  white-space:nowrap;
  font-size:12px;
}

@media(max-width:650px){
  .site-gate{
    padding:12px 14px 0;
  }

  .site-gate-card{
    padding:10px 12px;
  }

  .site-gate-card h1{
    font-size:24px;
    margin-bottom:8px;
  }

  .site-gate-row{
    grid-template-columns:minmax(0,1fr) 92px;
  }

  .site-gate-row input,
  .site-gate-row button{
    height:38px;
  }

  .site-gate-row input{
    font-size:16px;
  }

  #eventDate{
    width:150px !important;
    max-width:150px;
    height:36px;
    font-size:11px !important;
  }

  .event-tags{
    grid-template-columns:repeat(3,minmax(0,1fr)) !important;
    gap:7px;
  }

  .event-tag{
    padding:8px 8px;
    font-size:11px;
    text-align:left;
  }
}


/* 2026-09-16 dashboard additions */
.table-mode-row{
  display:flex;
  justify-content:flex-end;
  margin:0 0 10px;
}
.table-mode-row select{
  min-width:92px;
}
.graph-panel{
  margin-top:10px;
}
.graph-panel>summary{
  cursor:pointer;
  font-weight:700;
  padding:10px 0;
}
.graph-panel[open]>summary{
  margin-bottom:6px;
}
.graph-fullscreen-button{
  width:100%;
  margin-top:8px;
}
#graphFullscreen{
  position:fixed;
  inset:0;
  z-index:99999;
  background:#fff;
  color:#111;
  display:none;
  flex-direction:column;
}
#graphFullscreen.open{display:flex}
.graph-fs-toolbar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 10px;
  border-bottom:1px solid #ddd;
  flex:0 0 auto;
}
.graph-fs-title{
  font-weight:800;
  margin-right:auto;
}
.graph-fs-body{
  flex:1 1 auto;
  min-height:0;
  display:flex;
}
.graph-fs-chart{
  flex:1 1 auto;
  min-width:0;
  min-height:0;
  padding:10px;
  position:relative;
}
#fullscreenChart{
  width:100% !important;
  height:100% !important;
}
.graph-fs-side{
  width:min(32vw,360px);
  min-width:230px;
  border-left:1px solid #ddd;
  display:flex;
  flex-direction:column;
  transition:width .18s ease,min-width .18s ease;
}
.graph-fs-side.collapsed{
  width:44px;
  min-width:44px;
}
.graph-fs-side-head{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:44px;
  padding:5px;
  border-bottom:1px solid #eee;
}
.graph-fs-side-head button{
  width:34px;
  min-width:34px;
  padding:0;
  height:34px;
}
.graph-fs-side-title{font-weight:800}
.graph-fs-side.collapsed .graph-fs-side-title,
.graph-fs-side.collapsed .graph-fs-content{display:none}
.graph-fs-content{
  overflow:auto;
  padding:12px;
  min-width:230px;
}
.graph-fs-date{
  font-size:18px;
  font-weight:800;
  margin-bottom:10px;
}
.graph-fs-section{
  margin:14px 0 6px;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.06em;
  opacity:.65;
}
.graph-fs-event{
  padding:8px 0;
  border-bottom:1px solid #eee;
}
.graph-fs-event-bot{font-weight:800;margin-bottom:4px}
.graph-fs-note{font-size:12px;opacity:.75;margin-top:4px;white-space:pre-wrap}
.graph-fs-empty{opacity:.6}
body.graph-fullscreen-open{overflow:hidden}

/* login card at the bottom of the viewport */
.site-gate{
  position:fixed !important;
  left:0;
  right:0;
  bottom:0;
  top:auto !important;
  z-index:100000;
  max-width:1050px;
  margin:0 auto !important;
  padding:0 20px 18px !important;
  box-sizing:border-box;
}
.site-gate-card{
  box-shadow:0 -8px 28px rgba(0,0,0,.14);
}

@media(max-width:650px){
  .site-gate{padding:0 14px 12px !important}
}
@media(orientation:portrait){
  .graph-fs-body{flex-direction:column}
  .graph-fs-side{
    width:100%;
    min-width:0;
    height:min(34vh,300px);
    min-height:150px;
    border-left:0;
    border-top:1px solid #ddd;
    transition:height .18s ease,min-height .18s ease;
  }
  .graph-fs-side.collapsed{
    width:100%;
    min-width:0;
    height:44px;
    min-height:44px;
  }
  .graph-fs-content{min-width:0}
}


/* compact controls + fullscreen analysis controls */
.table-controls-row{
  display:grid;
  grid-template-columns:112px 94px minmax(0,1fr);
  gap:8px;
  align-items:center;
  margin-bottom:12px;
}
.table-controls-row select,
.table-controls-row input{
  width:100%;
  min-width:0;
}
.graph-panel .chart-area.chart-empty{
  height:0 !important;
  min-height:0 !important;
  margin:0 !important;
  padding:0 !important;
  overflow:hidden;
}
.graph-panel .compare-table.graph-empty{display:none}

.graph-fs-toolbar{
  flex-wrap:wrap;
  gap:6px;
}
.graph-fs-toolbar select,
.graph-fs-toolbar button,
.graph-fs-bots>summary{
  min-height:38px;
}
.graph-fs-bots{position:relative}
.graph-fs-bots>summary{
  list-style:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  padding:0 12px;
  border:1px solid #59606d;
  border-radius:12px;
  background:#1b1e23;
  color:#fff;
  white-space:nowrap;
}
.graph-fs-bots>summary::-webkit-details-marker{display:none}
.graph-fs-bots-list{
  position:absolute;
  z-index:20;
  top:calc(100% + 6px);
  right:0;
  width:min(320px,82vw);
  max-height:62vh;
  overflow:auto;
  padding:10px;
  border:1px solid #59606d;
  border-radius:12px;
  background:#1b1e23;
  color:#fff;
  box-shadow:0 10px 30px rgba(0,0,0,.28);
}
.graph-fs-bots-list label{
  display:block;
  padding:7px 4px;
}
.graph-fs-bots-list button{
  width:100%;
  margin-bottom:7px;
}
@media(max-width:650px){
  .table-controls-row{
    grid-template-columns:100px 88px minmax(0,1fr);
  }
  .graph-fs-toolbar{
    padding:6px;
  }
  .graph-fs-toolbar select{
    max-width:105px;
  }
  .graph-fs-bots>summary{
    padding:0 9px;
  }
}



/* clean mobile layout — isolated ordinary page / fullscreen */
html,body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}
*{box-sizing:border-box}

body,
button,
input,
select,
textarea,
summary,
table,
.tag-chip{
  font-size:12px;
}
h1{
  font-size:24px;
  line-height:1.1;
}
main,
.card,
.graph-panel,
.events-panel,
.all-bots{
  max-width:100%;
}

/* ordinary graph card */
.compare-controls{
  min-width:0;
}
.compare-controls select,
.compare-controls button,
.compare-controls input{
  min-width:0;
  max-width:100%;
}
@media(max-width:650px){
  .compare-controls{
    overflow:hidden;
  }
  .compare-controls .control-grid{
    grid-template-columns:repeat(4,minmax(0,1fr)) !important;
  }
}

/* all bots: latest | name | search */
.table-controls-row{
  display:grid;
  grid-template-columns:100px 88px minmax(0,1fr);
  gap:8px;
  align-items:center;
  width:100%;
}
.table-controls-row select,
.table-controls-row input{
  width:100%;
  min-width:0;
  max-width:100%;
  margin:0;
}

/* fullscreen only */
.graph-fs-toolbar{
  display:flex !important;
  flex-wrap:nowrap !important;
  align-items:center !important;
  gap:4px !important;
  padding:5px 8px !important;
  width:100% !important;
  max-width:100% !important;
  overflow:hidden !important;
}
.graph-fs-toolbar select,
.graph-fs-toolbar button,
.graph-fs-bots>summary{
  height:30px !important;
  min-height:30px !important;
  font-size:12px !important;
  line-height:28px !important;
  padding:0 5px !important;
  margin:0 !important;
  border-radius:8px !important;
  white-space:nowrap !important;
}
#fsMetric{flex:0 1 82px !important;width:82px !important;min-width:0 !important}
#fsDisplayMode{flex:0 1 62px !important;width:62px !important;min-width:0 !important}
#fsPeriod{flex:0 1 54px !important;width:54px !important;min-width:0 !important}
#fsBotsPanel{flex:0 1 64px !important;width:64px !important;min-width:0 !important}
#fsBotsSummary{width:100% !important;min-width:0 !important;max-width:none !important}
#closeGraphFullscreen{
  flex:0 0 28px !important;
  width:28px !important;
  min-width:28px !important;
  padding:0 !important;
}
.graph-fs-chart{position:relative !important}
.graph-corner-zoom{
  position:absolute !important;
  top:7px !important;
  right:7px !important;
  z-index:12 !important;
  width:28px !important;
  min-width:28px !important;
  height:28px !important;
  min-height:28px !important;
  padding:0 !important;
  margin:0 !important;
  border:0 !important;
  background:transparent !important;
  box-shadow:none !important;
  font-size:18px !important;
  line-height:28px !important;
}

/* event list alignment */
.events-panel h3,
.events-panel .events-table-wrap,
.events-panel table{
  margin-left:0 !important;
}
.events-panel h3{
  padding-left:0 !important;
  font-size:12px !important;
}
#statsTable th,
.compare-table th,
.events-panel th{
  text-transform:lowercase;
  font-size:12px;
}


/* fullscreen bots menu + zoom position correction */
.graph-fs-toolbar{
  overflow:visible !important;
  position:relative !important;
  z-index:100 !important;
}
.graph-fs-bots{
  position:relative !important;
  z-index:120 !important;
}
.graph-fs-bots-list{
  display:block;
  position:absolute !important;
  top:34px !important;
  left:0 !important;
  right:auto !important;
  z-index:1000 !important;
  width:min(280px,82vw) !important;
  max-height:62vh !important;
  overflow-y:auto !important;
  overflow-x:hidden !important;
}

.graph-fs-body{
  position:relative !important;
  z-index:1 !important;
}
.toolbar-zoom{
  flex:0 0 28px !important;
  width:28px !important;
  min-width:28px !important;
  height:30px !important;
  min-height:30px !important;
  padding:0 !important;
  margin:0 !important;
  border:0 !important;
  background:transparent !important;
  box-shadow:none !important;
  font-size:17px !important;
  line-height:30px !important;
}


/* fullscreen bots is a real JS button, not <details> */
#fsBotsSummary{
  display:flex !important;
  align-items:center !important;
  justify-content:flex-start !important;
  width:100% !important;
  height:30px !important;
  min-height:30px !important;
  padding:0 5px !important;
  margin:0 !important;
  border:1px solid #59606d !important;
  border-radius:8px !important;
  background:#1b1e23 !important;
  color:#fff !important;

<script>
const fmt=new Intl.NumberFormat('nl-NL');

const state={
  bots:[],
  meta:new Map(),
  history:null,
  daily:[]
};

let compareChart=null;


const htmlLegendPlugin={
  id:'htmlLegend',
  afterUpdate(chart,args,opts){
    const el=document.getElementById(opts.containerID);
    if(!el) return;
    let toggle=el.querySelector('.chart-legend-toggle');
    let list=el.querySelector('.chart-legend-list');
    if(!toggle){
      toggle=document.createElement('button'); toggle.type='button'; toggle.className='chart-legend-toggle';
      toggle.innerHTML='<span></span><span>▸</span>';
      list=document.createElement('div'); list.className='chart-legend-list'; list.hidden=true;
      toggle.onclick=()=>{list.hidden=!list.hidden;toggle.lastElementChild.textContent=list.hidden?'▸':'▾'};
      el.replaceChildren(toggle,list);
    }
    toggle.firstElementChild.textContent=`legend — ${chart.data.datasets.length} ${chart.data.datasets.length===1?'bot':'bots'}`;
    list.replaceChildren();
    chart.data.datasets.forEach((ds,i)=>{
      const b=document.createElement('button'); b.type='button'; b.className='chart-legend-item';
      b.style.opacity=chart.isDatasetVisible(i)?'1':'.4';
      const sw=document.createElement('span'); sw.className='chart-legend-swatch';
      sw.style.color=ds.borderColor||'#888'; sw.style.background=ds.backgroundColor||'transparent';
      const t=document.createElement('span'); t.textContent=ds.label||'';
      b.append(sw,t); b.onclick=()=>{chart.setDatasetVisibility(i,!chart.isDatasetVisible(i));chart.update()};
      list.appendChild(b);
    });
  }
};
Chart.register(htmlLegendPlugin);

const graphEventMarkerPlugin={
  id:'graphEventMarkers',
  afterDatasetsDraw(chart,args,options){
    const markers=options?.markers || [];
    if(!markers.length) return;

    const {ctx,chartArea,scales}=chart;
    if(!chartArea || !scales?.x) return;

    ctx.save();
    markers.forEach(marker=>{
      const index=chart.data.labels.findIndex((label,i)=>marker.index===i);
      if(index<0) return;

      const x=scales.x.getPixelForValue(index);
      if(!Number.isFinite(x)) return;

      ctx.beginPath();
      ctx.setLineDash([4,4]);
      ctx.strokeStyle='rgba(170,142,245,.9)';
      ctx.lineWidth=1;
      ctx.moveTo(x,chartArea.top);
      ctx.lineTo(x,chartArea.bottom);
      ctx.stroke();

      ctx.setLineDash([]);
      ctx.font='11px system-ui';
      ctx.textAlign='center';
      ctx.textBaseline='top';
      ctx.fillStyle='rgba(24,25,28,.9)';
      ctx.fillText(marker.icon || '•',x,chartArea.top+3);
    });
    ctx.restore();
  }
};

Chart.register(graphEventMarkerPlugin);

function graphMarkersForDays(days,selectedCids){
  const activeTags=selectedGraphEventTags()
    .filter(tag=>['edit','avatar','capped','tagged','alert'].includes(tag));

  if(!activeTags.length) return [];

  const selected=new Set(selectedCids.filter(cid=>cid!=='__total__'));
  const dateIndex=new Map(days.map((day,index)=>[day.date,index]));
  const markers=[];

  (eventsState.events || []).forEach(event=>{
    if(!selected.has(event.cid)) return;
    const index=dateIndex.get(event.date);
    if(index===undefined) return;

    activeTags.forEach(tag=>{
      const match=tag==='capped'
        ? (
            (Array.isArray(event.tags) && event.tags.includes('capped')) ||
            Object.prototype.hasOwnProperty.call(event.status || {},'capped')
          )
        : Array.isArray(event.tags) && event.tags.includes(tag);

      if(match){
        markers.push({
          index,
          cid:event.cid,
          tag,
          icon:eventTagIcon(tag),
          note:event.note || '',
          timestamp:eventTimestamp(event)
        });
      }
    });
  });

  return markers;
}

function tableDisplayLabel(cid){

function dayKey(timestamp){
  return new Date(timestamp).toLocaleDateString('sv-SE');
}


function buildDailySnapshots(snapshots){
  const daily=new Map();

  snapshots.forEach(snapshot=>{
    daily.set(
      dayKey(snapshot.timestamp),
      snapshot
    );
  });

  return [...daily.entries()]
    .sort((a,b)=>a[0].localeCompare(b[0]))
    .map(([date,snapshot])=>({
      date,
      snapshot
    }));
}


function getDailyEntry(date){
  return state.daily.find(
    item=>item.date===date
  ) || null;
}


function getLatestEntry(){
  return state.daily.at(-1) || null;
}


function getPreviousEntry(entry){
  if(!entry) return null;

  const index=state.daily.findIndex(
    item=>item.date===entry.date
  );

  return index>0
    ? state.daily[index-1]
    : null;
}


function getSelectedRange(){
  const from=
    document.querySelector('#fromDate')?.value || '';

  const to=
    document.querySelector('#toDate')?.value || '';

  const latest=getLatestEntry();

  const endEntry=
    to
      ? getDailyEntry(to)
      : latest;

  let startEntry=null;

  if(from){
    startEntry=getDailyEntry(from);
  }else if(endEntry){
    startEntry=getPreviousEntry(endEntry);
  }

  return {
    from,
    to,
    startEntry,
    endEntry
  };
}


function getTableRows(){
  const {
    startEntry,
    endEntry
  }=getSelectedRange();

  if(!endEntry){
    return [];
  }

  const startMap=
    new Map(
      (startEntry?.snapshot.bots || [])
        .map(b=>[b.cid,b])
    );

  const endMap=
    new Map(
      (endEntry.snapshot.bots || [])
        .map(b=>[b.cid,b])
    );

  return [...state.meta.values()]
    .map(meta=>{
      const startBot=
        startMap.get(meta.cid);

      const endBot=
        endMap.get(meta.cid);

      const startMessages=
        Number.isFinite(startBot?.messages)
          ? startBot.messages
          : null;

      const endMessages=
        Number.isFinite(endBot?.messages)
          ? endBot.messages
          : null;

      const growth=
        Number.isFinite(startMessages) &&
        Number.isFinite(endMessages)
          ? endMessages-startMessages
          : null;

      return {
        cid:meta.cid,
        name:meta.name || meta.cid,
        url:meta.url,
        order:meta.creation_order ?? 9999,
        startMessages,
        messages:endMessages,
        growth,
        collectors:
          Number.isFinite(endBot?.collectors)
            ? endBot.collectors
            : null,
        stale:endBot?.stale || false
      };
    });
}


function getGraphDays(){
  let days=[...state.daily];

  const from=
    document.querySelector('#fromDate')?.value || '';

  const to=
    document.querySelector('#toDate')?.value || '';

  const period=
    document.querySelector('#comparePeriod').value;

  if(from){
    const endDate=
      to || getLatestEntry()?.date;

    days=days.filter(item=>
      item.date>=from &&
      (!endDate || item.date<=endDate)
    );

    return days;
  }

  if(to){
    days=days.filter(
      item=>item.date<=to
    );
  }

  if(period!=='all' && days.length){

    if(period==='1'){
      days=days.slice(-2);
    }else{
      const endTime=
        new Date(
          days.at(-1).snapshot.timestamp
        ).getTime();

      const cutoff=
        endTime-
        (
          Number(period)*
          24*60*60*1000
        );

      days=days.filter(
        item=>
          new Date(
            item.snapshot.timestamp
          ).getTime()>=cutoff
      );
    }
  }

  return days;
}


function totalForSnapshot(snapshot,metric){
  const sourceMetric=
    metric==='growth'
      ? 'messages'
      : metric;

  return (snapshot.bots||[])
    .reduce(
      (sum,bot)=>
        sum+
        (
          Number.isFinite(bot[sourceMetric])
            ? bot[sourceMetric]
            : 0
        ),
      0
    );
}

function parseDay(date){
  return new Date(String(date)+'T00:00:00');
}

function daysBetweenInclusive(startDate,endDate){
  const ms=24*60*60*1000;
  return Math.floor((parseDay(endDate)-parseDay(startDate))/ms)+1;
}

function currentPersistentStatus(cid,tag){
  let active=false;
  [...eventsState.events]
    .filter(event=>
      event.cid===cid &&
      Object.prototype.hasOwnProperty.call(event.status || {},tag)
    )
    .sort((a,b)=>
      String(a.date||'').localeCompare(String(b.date||'')) ||
      String(a.updatedAt||'').localeCompare(String(b.updatedAt||''))
    )
    .forEach(event=>{
      active=event.status?.[tag]===true;
    });
  return active;
}

function activeNewCids(){
  const latestDate=getLatestEntry()?.date;
  const result=new Set();
  if(!latestDate) return result;

  const latestNewByCid=new Map();
  eventsState.events.forEach(event=>{
    if(
      event.cid &&
      event.cid!=='__profile__' &&
      Array.isArray(event.tags) &&
      event.tags.includes('new') &&
      String(event.date||'')<=latestDate
    ){
      const old=latestNewByCid.get(event.cid);
      if(!old || String(event.date)>String(old.date)){
        latestNewByCid.set(event.cid,event);
      }
    }
  });

  latestNewByCid.forEach((event,cid)=>{
    const age=daysBetweenInclusive(event.date,latestDate);
    if(age>=1 && age<=7) result.add(cid);
  });

  return result;
}

function currentFreezeInfo(){
  const infos=[];
  state.meta.forEach((meta,cid)=>{
    const p=freezePeriodsForCid(cid).find(p=>p.active && qualifiesFreezePeriod(p));
    if(p) infos.push({
      cid,name:meta?.name||cid,since:p.start,days:p.days,
      threshold:p.threshold,startMessages:p.startMessages
    });
  });
  return infos.sort((a,b)=>b.since.localeCompare(a.since)||a.name.localeCompare(b.name));
}


function eventTimestamp(event){
  return event?.timestamp || event?.createdAt || event?.updatedAt || event?.date || '';
}

function formatEventTimestamp(event){
  const raw=eventTimestamp(event);
  if(!raw) return '—';

  if(/^\d{4}-\d{2}-\d{2}$/.test(raw)){
    return new Date(raw+'T00:00:00').toLocaleDateString(
      'nl-NL',{day:'numeric',month:'numeric',year:'2-digit'}
    );
  }

  const d=new Date(raw);
  if(Number.isNaN(d.getTime())) return String(raw);

  return d.toLocaleString('nl-NL',{
    day:'numeric',month:'numeric',year:'2-digit',
    hour:'2-digit',minute:'2-digit'
  });
}

function freezeThresholdForMessages(messages){
  if(!Number.isFinite(messages)) return Infinity;
  if(messages < 5000) return 7;
  if(messages <= 20000) return 2;
  return 1;
}
function qualifiesFreezePeriod(period){
  return !!period && period.days >= period.threshold;
}

function freezePeriodsForCid(cid){
  const days=[...state.daily].sort((a,b)=>a.date.localeCompare(b.date));
  const periods=[];
  let startIndex=null, threshold=null, startMessages=null;

  const closePeriod=(endIndex,active)=>{
    if(startIndex===null) return;
    periods.push({
      cid,start:days[startIndex].date,end:days[endIndex].date,
      days:endIndex-startIndex+1,active,threshold,startMessages
    });
    startIndex=null; threshold=null; startMessages=null;
  };

  for(let i=1;i<days.length;i++){
    const now=snapshotBot(days[i].snapshot,cid);
    const before=snapshotBot(days[i-1].snapshot,cid);
    if(!now || !before || !Number.isFinite(now.messages) || !Number.isFinite(before.messages)){
      if(startIndex!==null) closePeriod(i-1,false);
      continue;
    }
    const delta=now.messages-before.messages;
    if(delta===0){
      if(startIndex===null){
        startIndex=i;
        startMessages=before.messages;
        threshold=freezeThresholdForMessages(startMessages);
      }
    }else{
      // Positive growth defrosts. Negative growth is a correction/unknown, not a freeze.
      if(startIndex!==null) closePeriod(i-1,false);
    }
  }
  if(startIndex!==null) closePeriod(days.length-1,true);
  return periods;
}

function freezeHistory(){
  const result=[];
  state.meta.forEach((meta,cid)=>{
    freezePeriodsForCid(cid)
      .filter(p=>!p.active && qualifiesFreezePeriod(p))
      .forEach(p=>result.push({...p,name:meta?.name||cid}));
  });
  return result.sort((a,b)=>
    b.end.localeCompare(a.end)||b.start.localeCompare(a.start)||a.name.localeCompare(b.name)
  );
}

function graphEventDateRange(){
  const days=getGraphDays();
  return {
    from:days[0]?.date || '',
    to:days.at(-1)?.date || ''

}

function eventFilterCids(tag){
  if(tag==='freeze') return currentFreezeCids();
  if(tag==='new') return activeNewCids();

  if(tag==='banned'){
    const set=new Set();
    state.meta.forEach((meta,cid)=>{
      if(currentPersistentStatus(cid,'banned')) set.add(cid);
    });
    return set;
  }

  if(tag==='capped'){
    return new Set(
      eventsState.events
        .filter(event=>Array.isArray(event.tags) && event.tags.includes('capped'))
        .map(event=>event.cid)
    );
  }

  const {from,to}=graphEventDateRange();
  return new Set(
    eventsState.events
      .filter(event=>
        event.cid!=='__profile__' &&
        (!from || String(event.date||'')>=from) &&
        (!to || String(event.date||'')<=to) &&
        Array.isArray(event.tags) &&
        event.tags.includes(tag)
      )
      .map(event=>event.cid)
  );
}

function drawCompareChart(){
  renderFreezeOverview();
  renderEventAnalysisOverview();
  const metric=
    document.querySelector(
      '#compareMetric'
    ).value;

  const selected=
    [
      ...document.querySelectorAll(
        '#compareBots input[type="checkbox"]:checked:not(#selectAllBots)'
      )
    ]
    .map(
      i=>i.value
    );

  const realSelected=
    selected.filter(
      cid=>cid!=='__total__'
    );

  const totalSelected=
    selected.includes('__total__');

  document.querySelector(
    '#compareSummary'
  ).textContent=
    selected.length===0
      ? 'bots'
      : totalSelected && realSelected.length===0
        ? 'Total selected'
        : totalSelected
          ? realSelected.length+' bots + Total'
          : realSelected.length+' bots selected';

  if(compareChart){
    compareChart.destroy();
    compareChart=null;
  }

  document.querySelector(
    '#compareRows'
  ).innerHTML='';

  if(
    selected.length===0 ||
    !state.history
  ){
    document.querySelector('.chart-area')?.classList.add('chart-empty');
    document.querySelector('.compare-table')?.classList.add('graph-empty');
    return;
  }

  document.querySelector('.chart-area')?.classList.remove('chart-empty');
  document.querySelector('.compare-table')?.classList.remove('graph-empty');

  const days=
    getGraphDays();

  if(!days.length){
    return;
  }

  const labels=
    days.map(item=>
      new Date(
        item.snapshot.timestamp
      )
      .toLocaleDateString(
        'nl-NL',
        {
          day:'2-digit',
          month:'2-digit',
          year:'2-digit'
        }
      )
    );

  const datasets=
    selected.map(cid=>{

      let rawValues;

      if(cid==='__total__'){
        rawValues=
          days.map(item=>
            totalForSnapshot(
              item.snapshot,
              metric
            )
          );
      }else{
        const sourceMetric=
          metric==='growth'
            ? 'messages'
            : metric;

        rawValues=
          days.map(item=>{
            const bot=
              (
                item.snapshot.bots||
                []
              )
              .find(
                b=>b.cid===cid
              );

            return (
              bot &&
              Number.isFinite(
                bot[sourceMetric]
              )
            )
              ? bot[sourceMetric]
              : null;
          });
      }

      let values=rawValues;

      if(metric==='growth'){
        const first=
          rawValues.find(
            value=>value!==null
          );

        values=
          rawValues.map(
            value=>
              value===null ||
              first===undefined
                ? null
                : value-first
          );
      }

      return {
        label:
          displayLabel(cid),
        data:
          values,
        tension:
          0.2,
        spanGaps:
          true
      };
    });

  compareChart=
    new Chart(
      document.querySelector(
        '#compareChart'
      ),
      {
        type:'line',
        data:{
          labels,
          datasets
        },
        options:{
          responsive:true,
          maintainAspectRatio:false,
          interaction:{
            intersect:false,
            mode:'index'
          },
          plugins:{
            htmlLegend:{containerID:'compareChartLegend'},
            legend:{display:false},
            graphEventMarkers:{
              markers:graphMarkersForDays(days,selected)
            },
            zoom:{
              pan:{
                enabled:true,
                mode:'x',
                threshold:25
              },
              zoom:{
                wheel:{
                  enabled:true,
                  speed:0.05
                },
                pinch:{
                  enabled:true
                },
                mode:'x'
              }
            }
          },
          scales:{
            y:{
              min:0,
              beginAtZero:true,
              ticks:{
                callback:
                  value=>
                    fmt.format(
                      value
                    )
              }
            }
          }
        }
      }
    );

  const compareData=
    selected.map(cid=>{

      let rawValues;

      if(cid==='__total__'){
        rawValues=
          days.map(item=>
            totalForSnapshot(
              item.snapshot,
              metric
            )
          );
      }else{
        const sourceMetric=
          metric==='growth'
            ? 'messages'
            : metric;

        rawValues=
          days.map(item=>{
            const bot=
              (
                item.snapshot.bots||
                []
              )
              .find(
                b=>b.cid===cid
              );

            return (
              bot &&
              Number.isFinite(
                bot[sourceMetric]
              )
            )
              ? bot[sourceMetric]
              : null;
          })
          .filter(
            value=>value!==null
          );
      }

      if(!rawValues.length){
        return {
          cid,
          start:null,
          current:null,
          growth:null
        };
      }

      const first=
        rawValues[0];

      const last=
        rawValues.at(-1);

      if(metric==='growth'){
        const growth=
          last-first;

        return {
          cid,
          start:0,
          current:growth,
          growth:growth
        };
      }

      return {
        cid,
        start:first,
        current:last,
        growth:last-first
      };
    });

  const realCompareData=
    compareData.filter(
      row=>row.cid!=='__total__'
    );

  const totalStart=
    realCompareData.reduce(
      (sum,row)=>
        sum+(row.start??0),
      0
    );

  const totalCurrent=
    realCompareData.reduce(
      (sum,row)=>
        sum+(row.current??0),
      0
    );

  const totalGrowth=
    realCompareData.reduce(
      (sum,row)=>
        sum+(row.growth??0),
      0
    );

  const compareRowsHtml=
    compareData.map(row=>{

      if(
        row.start===null ||
        row.current===null
      ){
        return `
          <tr>
            <td>${displayLabel(row.cid)}</td>
            <td>—</td>
            <td>—</td>
            <td>—</td>
          </tr>
        `;
      }

      return `
        <tr>
          <td>
            ${displayLabel(row.cid)}
          </td>

          <td>
            ${fmt.format(row.start)}
          </td>

          <td>
            ${
              row.current>0 &&
              metric==='growth'
                ? '+'
                : ''
            }${fmt.format(row.current)}
          </td>

          <td
            class="${
              row.growth>0
                ? 'positive'
                : row.growth<0
                  ? 'negative'
                  : ''
            }"
          >
            ${
              row.growth>0
                ? '+'
                : ''
            }${fmt.format(row.growth)}
          </td>
        </tr>
      `;
    }).join('');

  const compareTotalHtml=
    realCompareData.length>=2
      ? `
        <tr class="total-row">
          <td>Selected total</td>

          <td>
            ${fmt.format(totalStart)}
          </td>

          <td>
            ${
              totalCurrent>0 &&
              metric==='growth'
                ? '+'
                : ''
            }${fmt.format(totalCurrent)}
          </td>

          <td
            class="${
              totalGrowth>0
                ? 'positive'
                : totalGrowth<0
                  ? 'negative'
                  : ''
            }"
          >
            ${
              totalGrowth>0
                ? '+'
                : ''
            }${fmt.format(totalGrowth)}
          </td>
        </tr>
      `
      : '';

  document.querySelector(
    '#compareRows'
  ).innerHTML=
    compareRowsHtml+
    compareTotalHtml;
}

function persistentStatusNow(cid,tag){
  let active=false;
  [...eventsState.events]
    .filter(event=>
      event.cid===cid &&
      Object.prototype.hasOwnProperty.call(event.status || {},tag)
    )
    .sort((a,b)=>
      String(a.date||'').localeCompare(String(b.date||'')) ||
      String(a.updatedAt||'').localeCompare(String(b.updatedAt||''))
    )
    .forEach(event=>{ active=event.status[tag]===true; });
  return active;
}

function graphPeriodDates(){
  return new Set(getGraphDays().map(day=>day.date));
}

function cidMatchesGraphTag(cid,tag){
  if(tag==='freeze' || tag==='banned'){
    return persistentStatusNow(cid,tag);
  }

  if(tag==='capped'){
    return eventsState.events.some(event=>
      event.cid===cid &&
      Array.isArray(event.tags) &&
      event.tags.includes('capped')
    );
  }

  const dates=graphPeriodDates();
  return eventsState.events.some(event=>
    event.cid===cid &&
    dates.has(event.date) &&
    Array.isArray(event.tags) &&
    event.tags.includes(tag)
  );
}

function applyGraphEventFilters(){
  const buttons=[...document.querySelectorAll(
    '#compareBots .graph-event-filter.active'
  )];

  const activeTags=buttons
    .map(button=>button.dataset.graphTag)
    .filter(tag=>tag!=='capped');

  const cappedActive=buttons.some(button=>button.dataset.graphTag==='capped');

  const allInputs=[...document.querySelectorAll(
    '#compareBots input[type="checkbox"]:not(#selectAllBots):not(#totalProfile)'
  )];

  if(!activeTags.length && !cappedActive){
    renderFreezeOverview();
    drawCompareChart();
    return;
  }

  allInputs.forEach(cb=>{
    const ordinaryMatch=activeTags.some(tag=>cidMatchesGraphTag(cb.value,tag));

    let capMatch=false;
    if(cappedActive){
      const isCapped=cidMatchesGraphTag(cb.value,'capped');
      capMatch=cappedFilterMode==='uncapped' ? !isCapped : isCapped;
    }

    cb.checked=ordinaryMatch || capMatch;
  });

  document.querySelector('#selectAllBots').checked=false;
  renderFreezeOverview();
  drawCompareChart();
}

document.querySelector('#compareBots')
  .addEventListener('click',e=>{
    const button=e.target.closest('.graph-event-filter');
    if(!button) return;

    const tag=button.dataset.graphTag;

    if(tag==='capped'){
      // 🔄 cycles: off → capped → uncapped → off
      if(cappedFilterMode==='off'){
        cappedFilterMode='capped';
        button.classList.add('active');
        button.classList.remove('uncapped');
        button.title='capped';
        button.setAttribute('aria-label','capped');
      }else if(cappedFilterMode==='capped'){
        cappedFilterMode='uncapped';
        button.classList.add('active','uncapped');
        button.title='uncapped';
        button.setAttribute('aria-label','uncapped');
      }else{
        cappedFilterMode='off';
        button.classList.remove('active','uncapped');
        button.title='capped';
        button.setAttribute('aria-label','capped');
      }
    }else{
      button.classList.toggle('active');
    }

    applyGraphEventFilters();
    renderFreezeOverview();
  });

async function eventsRequest(path,options={}){
  const headers={
    ...(options.headers || {})
  };

  if(eventsState.key){
    headers['x-events-key']=eventsState.key;
  }

  headers['x-events-profile']=EVENTS_PROFILE;

  if(options.body){
    headers['content-type']='application/json';
  }

  const response=
    await fetch(
      EVENTS_API+path,
      {
        ...options,
        headers,
        cache:'no-store'
      }
    );

  let data={};

  try{
    data=await response.json();
  }catch{
    data={};
  }

  if(!response.ok){
    throw new Error(
      data.error ||
      'Request failed'
    );
  }

  return data;
}



function freezeStateBeforeDate(cid,date){
  let active=false;

  [...eventsState.events]
    .filter(event=>
      event.cid===cid &&
      String(event.date || '')<date &&
      Object.prototype.hasOwnProperty.call(event.status || {},'freeze')
    )
    .sort((a,b)=>
      String(a.date||'').localeCompare(String(b.date||'')) ||
      String(a.updatedAt||'').localeCompare(String(b.updatedAt||''))
    )
    .forEach(event=>{
      active=event.status.freeze===true;
    });

  return active;
}


async function autoEndFreezesFromGrowth(){
  if(eventsState.autoFreezeBusy || !eventsState.unlocked) return false;
  if(!Array.isArray(state.daily) || state.daily.length<2) return false;

  const latest=state.daily.at(-1);
  const previous=state.daily.at(-2);

  if(!latest?.date || !previous) return false;

  const previousBots=new Map(
    (previous.snapshot?.bots || []).map(bot=>[bot.cid,bot])
  );

  const toEnd=(latest.snapshot?.bots || []).filter(bot=>{
    const before=previousBots.get(bot.cid);

    return (
      Number.isFinite(bot.messages) &&
      Number.isFinite(before?.messages) &&
      bot.messages>before.messages &&
      freezeStateBeforeDate(bot.cid,latest.date)
    );
  });

  if(!toEnd.length) return false;

  eventsState.autoFreezeBusy=true;

  try{
    for(const bot of toEnd){
      const existing=eventsState.events.find(event=>
        event.date===latest.date &&
        event.cid===bot.cid
      );

      const status={
        ...(existing?.status || {}),
        freeze:false
      };

      await eventsRequest(
        '/events',
        {
          method:'POST',
          body:JSON.stringify({
            id:existing?.id || undefined,
            date:latest.date,
            cid:bot.cid,
            tags:[...(existing?.tags || [])],
            status,
            note:existing?.note || ''
          })
        }
      );
    }

    return true;
  }finally{
    eventsState.autoFreezeBusy=false;
  }
}



async function syncAutomaticFreezeStatus(){
  if(eventsState.autoFreezeBusy || !eventsState.unlocked) return false;

  const latest=getLatestEntry();
  if(!latest?.date || state.daily.length<2) return false;

  const frozen=currentFreezeCids();
  const changes=[];

  for(const [cid] of state.meta){
    const current=currentPersistentStatus(cid,'freeze');
    const shouldFreeze=frozen.has(cid);

    if(current!==shouldFreeze){
      changes.push({cid,freeze:shouldFreeze});
    }
  }

  if(!changes.length) return false;

  eventsState.autoFreezeBusy=true;
  try{
    for(const change of changes){
      const existing=eventsState.events.find(event=>
        event.date===latest.date &&
        event.cid===change.cid
      );

      await eventsRequest('/events',{
        method:'POST',
        body:JSON.stringify({
          id:existing?.id || undefined,
          date:latest.date,
          cid:change.cid,
          tags:[...(existing?.tags || [])],
          status:{
            ...(existing?.status || {}),
            freeze:change.freeze
          },
          note:existing?.note || ''
        })
      });
    }
    return true;
  }finally{
    eventsState.autoFreezeBusy=false;
  }
}

async function loadEvents(){
  const rows=
    document.querySelector('#eventsRows');

  try{
    const data=
      await eventsRequest('/events');

    eventsState.events=
      Array.isArray(data.events)
        ? data.events
        : [];

    const autoChanged=await syncAutomaticFreezeStatus();

    if(autoChanged){
      const refreshed=await eventsRequest('/events');
      eventsState.events=
        Array.isArray(refreshed.events)
          ? refreshed.events
          : [];
    }

    renderEvents();
    loadEventForSelection();

  }catch(error){
    rows.innerHTML=`
      <tr>
        <td colspan="5" class="error">
          ${error.message}
        </td>
      </tr>
    `;
  }
}


function eventMatchesFilterTag(event,tag){

    return Object.prototype.hasOwnProperty.call(event.status || {},tag);
  }

  return Array.isArray(event.tags) && event.tags.includes(tag);
}

function renderEvents(){
  const rows=document.querySelector('#eventsRows');
  const selectedCid=document.querySelector('#eventBot')?.value || '';
  const title=document.querySelector('#savedEventsTitle');

  let visibleEvents=[...eventsState.events];

  if(eventsState.filterAll){
    if(selectedCid){
      visibleEvents=visibleEvents.filter(event=>event.cid===selectedCid);
    }

    if(eventsState.filterDate){
      visibleEvents=visibleEvents.filter(
        event=>event.date===eventsState.filterDate
      );
    }

    if(eventsState.freezeFilter==='start'){
      visibleEvents=visibleEvents.filter(
        event=>event.status?.freeze===true
      );
    }else if(eventsState.freezeFilter==='off'){
      visibleEvents=visibleEvents.filter(
        event=>event.status?.freeze===false
      );
    }

    const selectedTags=selectedEventTags();

    if(selectedTags.length){
      visibleEvents=visibleEvents.filter(event=>
        selectedTags.some(tag=>eventMatchesFilterTag(event,tag))
      );
    }

    visibleEvents.sort((a,b)=>
      String(b.date||'').localeCompare(String(a.date||'')) ||
      String(b.updatedAt||'').localeCompare(String(a.updatedAt||''))
    );

    if(title){
      const botPart=selectedCid ? eventBotLabel(selectedCid) : 'all bots';
      const tagPart=selectedTags.length
        ? ' — '+selectedTags.map(eventTagLabel).join(' + ')
        : '';
      const datePart=eventsState.filterDate || 'all dates';
      const freezePart=eventsState.freezeFilter
        ? ' — freeze '+eventsState.freezeFilter
        : '';
      title.textContent=botPart+' — '+datePart+freezePart+tagPart;
    }
  }else{
    const normalCid=selectedCid || '__profile__';

    visibleEvents=visibleEvents.filter(event=>event.cid===normalCid);

    if(title){
      title.textContent=eventBotLabel(normalCid)+' — events';
    }
  }

  if(!visibleEvents.length){
    rows.innerHTML=`
      <tr>
        <td colspan="5">
          no matching events
        </td>
      </tr>
    `;
    return;
  }

  rows.innerHTML=visibleEvents.map(event=>{
    const visibleTags=[...(event.tags || [])];

    if(event.status?.banned===true) visibleTags.push('banned');
    if(event.status?.freeze===true) visibleTags.push('freeze');
    if(event.status?.banned===false) visibleTags.push('__banned_off__');
    if(event.status?.freeze===false) visibleTags.push('__freeze_off__');

    const tags=visibleTags
      .map(tag=>{
        if(tag==='__banned_off__') return `<span class="tag-chip">🚫 off</span>`;
        if(tag==='__freeze_off__') return `<span class="tag-chip">*️⃣ off</span>`;
        return `<span class="tag-chip">${eventTagIcon(tag)}</span>`;
      })
      .join('');

    return `
      <tr>
        <td>${event.date || '—'}</td>
        <td>${eventBotLabel(event.cid)}</td>
        <td>${tags || '—'}</td>
        <td class="event-note">${event.note || '—'}</td>
        <td class="event-controls">
          <button type="button" data-event-edit="${event.id}">edit</button>
          <button type="button" data-event-delete="${event.id}">delete</button>
        </td>
      </tr>
    `;
  }).join('');
}

function eventsForSelection(){
  const date=document.querySelector('#eventDate').value;
  const cid=document.querySelector('#eventBot').value;

  if(!date || !cid) return [];

  return eventsState.events
    .filter(event=>event.cid===cid && event.date<=date)
    .sort((a,b)=>
      a.date.localeCompare(b.date) ||
      String(a.updatedAt||'').localeCompare(String(b.updatedAt||''))
    );
}


function persistentStateAtSelection(){
  const stateNow={banned:false,freeze:false};

  eventsForSelection().forEach(event=>{
    const status=event.status || {};
    PERSISTENT_TAGS.forEach(tag=>{
      if(typeof status[tag]==='boolean'){
        stateNow[tag]=status[tag];
      }
    });
  });

  return stateNow;
}


function persistentStateBeforeSelection(){
  const date=document.querySelector('#eventDate').value;
  const cid=document.querySelector('#eventBot').value;
  const stateBefore={banned:false,freeze:false};

  if(!date || !cid){
    return stateBefore;
  }

  eventsState.events
    .filter(event=>event.cid===cid && event.date<date)
    .sort((a,b)=>
      a.date.localeCompare(b.date) ||
      String(a.updatedAt||'').localeCompare(String(b.updatedAt||''))
    )
    .forEach(event=>{
      const status=event.status || {};

      PERSISTENT_TAGS.forEach(tag=>{
        if(typeof status[tag]==='boolean'){
          stateBefore[tag]=status[tag];
        }
      });
    });

  return stateBefore;
}


function dayEventTags(event){
  return (event?.tags || []).filter(tag=>!PERSISTENT_TAGS.has(tag));
}

function newStatusActiveAtSelection(){
  const date=document.querySelector('#eventDate').value;
  const cid=document.querySelector('#eventBot').value;

  if(!date || !cid) return false;

  const latestNew=eventsState.events
    .filter(event=>
      event.cid===cid &&
      event.date<=date &&
      Array.isArray(event.tags) &&
      event.tags.includes('new')
    )
    .sort((a,b)=>b.date.localeCompare(a.date))[0];

  if(!latestNew) return false;

  const start=new Date(latestNew.date+'T00:00:00');
  const current=new Date(date+'T00:00:00');
  const age=Math.floor((current-start)/(24*60*60*1000));

  return age>=0 && age<7;
}

async function saveEvent(){
  if(eventsState.filterAll){
    return;
  }

  const date=document.querySelector('#eventDate').value;
  const cid=document.querySelector('#eventBot').value;
  const selected=selectedEventTags();
  let tags=selected.filter(tag=>!PERSISTENT_TAGS.has(tag));

  const existingToday=currentSelectionEvent();
  const inheritedNew=
    selected.includes('new') &&
    newStatusActiveAtSelection() &&
    !(existingToday?.tags || []).includes('new');

  if(inheritedNew){
    tags=tags.filter(tag=>tag!=='new');
  }

  const before=persistentStateBeforeSelection();
  const current={
    banned:selected.includes('banned'),
    freeze:selected.includes('freeze')
  };

  const persistent={};

  PERSISTENT_TAGS.forEach(tag=>{
    if(current[tag]!==before[tag]){
      persistent[tag]=current[tag];
    }
  });

  const note=document.querySelector('#eventNote').value.trim();
  const status=document.querySelector('#eventSaveStatus');

  if(!eventsState.unlocked){
    status.textContent='unlock first';
    status.className='error';
    return;
  }

  if(!date || !cid){
    status.textContent='choose date and bot';
    status.className='error';
    return;
  }

  status.textContent='saving…';
  status.className='';

  try{
    const existing=currentSelectionEvent();

    await eventsRequest(
      '/events',
      {
        method:'POST',
        body:JSON.stringify({
          id:existing?.id || eventsState.editingId || undefined,
          date,
          cid,
          tags,
          status:persistent,
          note
        })
      }
    );

    status.textContent='saved ✓';
    status.className='ok';

    await loadEvents();

  }catch(error){
    if(error.message==='locked' || error.message==='wrong password'){
      lockEvents();
    }

    status.textContent=error.message;
    status.className='error';
  }
}

}

let cappedFilterMode='off';
let fullscreenChartInstance=null;

function snapshotBot(snapshot,cid){
  return (snapshot?.bots || []).find(bot=>bot.cid===cid) || null;
}

function previousGraphDay(date){
  const days=[...state.daily].sort((a,b)=>a.date.localeCompare(b.date));
  const index=days.findIndex(day=>day.date===date);
  return index>0 ? days[index-1] : null;
}

function fullscreenEventTags(event){
  const tags=[...(event.tags || [])];
  if(event.status?.banned===true) tags.push('banned');
  if(event.status?.freeze===true) tags.push('freeze');
  if(event.status?.banned===false) tags.push('unbanned');
  return [...new Set(tags)];
}

function fullscreenSelectedCids(){
  return [...document.querySelectorAll(
    '#compareBots input[type="checkbox"]:checked:not(#selectAllBots)'
  )].map(input=>input.value);
}

function renderFullscreenDate(date,cid){
  const box=document.querySelector('#fullscreenEventsContent');
  if(!box) return;

  const day=state.daily.find(item=>item.date===date);
  const previous=previousGraphDay(date);
  let stats='';

  if(day && cid && cid!=='__total__'){
    const now=snapshotBot(day.snapshot,cid);
    const before=snapshotBot(previous?.snapshot,cid);

    if(now){
      const growth=
        before && Number.isFinite(now.messages) && Number.isFinite(before.messages)
          ? now.messages-before.messages
          : null;

      const collectorGrowth=
        before && Number.isFinite(now.collectors) && Number.isFinite(before.collectors)
          ? now.collectors-before.collectors
          : null;

      stats=`
        <div class="graph-fs-section">${eventBotLabel(cid)}</div>
        <div>${Number.isFinite(now.messages)?fmt.format(now.messages):'—'} messages</div>
        <div>${growth===null?'—':(growth>=0?'+':'')+fmt.format(growth)} growth</div>
        <div>${Number.isFinite(now.collectors)?fmt.format(now.collectors):'—'} collectors${collectorGrowth===null?'':` (${collectorGrowth>=0?'+':''}${fmt.format(collectorGrowth)})`}</div>
      `;
    }
  }

  const selected=fullscreenSelectedCids().filter(cid=>cid!=='__total__');

  const events=(eventsState.events || []).filter(event=>{
    if(event.date!==date) return false;

    if(cid && cid!=='__total__'){
      return event.cid===cid || event.cid==='__profile__';
    }

    if(selected.length){
      return event.cid==='__profile__' || selected.includes(event.cid);
    }

    return event.cid==='__profile__';
  });

  const eventsHtml=events.length
    ? events.map(event=>`
        <div class="graph-fs-event">
          <div class="graph-fs-event-bot">${eventBotLabel(event.cid)}</div>
          <div>${fullscreenEventTags(event).map(tag=>`<span class="tag-chip">${eventTagIcon(tag)}</span>`).join(' ') || '—'}</div>
          ${event.note?`<div class="graph-fs-note">${event.note}</div>`:''}
        </div>
      `).join('')
    : '<div class="graph-fs-empty">no saved events on this date.</div>';

  box.innerHTML=`
    <div class="graph-fs-date">${new Date(date+'T00:00:00').toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'})}</div>
    ${stats}
    <div class="graph-fs-section">events</div>
    ${eventsHtml}
    ${cid && cid!=='__total__'
      ? `<button type="button" class="graph-fs-edit-link" data-go-event-date="${date}" data-go-event-cid="${cid}">edit event →</button>`
      : ''}
  `;
}

function buildFullscreenChart(){

  if(fullscreenChartInstance){
    fullscreenChartInstance.destroy();
    fullscreenChartInstance=null;
  }

  if(!canvas){
    return;
  }

  /* Always rebuild the normal chart first so fullscreen uses the current selection. */
  drawCompareChart();

  if(!compareChart || !compareChart.data.datasets.length){
    const ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    return;
  }

  const days=getGraphDays();
  const selected=fullscreenSelectedCids();

  const clonedDatasets=compareChart.data.datasets.map((dataset,index)=>({
    ...dataset,
    data:[...(dataset.data || [])],
    _cid:selected[index] || null
  }));

  fullscreenChartInstance=new Chart(canvas,{
    type:'line',
    data:{
      labels:[...(compareChart.data.labels || [])],
      datasets:clonedDatasets
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      animation:false,
      interaction:{
        intersect:false,
        mode:'nearest'
      },
      scales:{
        x:{
          ticks:{
            maxRotation:50,
            minRotation:50
          }
        },
        y:{
          min:0,
          beginAtZero:true
        }
      },
      plugins:{
        htmlLegend:{containerID:'fullscreenChartLegend'},
            legend:{display:false},
            graphEventMarkers:{
          markers:graphMarkersForDays(days,selected)
        },
        legend:{display:false,
          display:true
        },
        tooltip:{
          enabled:true
        },
        zoom:{
          pan:{
            enabled:true,
            mode:'x'
          },
          zoom:{
            wheel:{enabled:true},
            pinch:{enabled:true},
            mode:'x'
          }
        }
      },
      onClick:(event,elements)=>{
        if(!elements?.length) return;

        const hit=elements[0];
        const cid=clonedDatasets[hit.datasetIndex]?._cid || null;
        const date=days[hit.index]?.date;

        if(date){
          renderFullscreenDate(date,cid);
        }
      }
    }
  });

  setTimeout(()=>{
    fullscreenChartInstance?.resize();
  },50);
}
function refreshFullscreenGraph(){
  drawCompareChart();
  renderFullscreenBots();
  requestAnimationFrame(buildFullscreenChart);
}

function openGraphFullscreen(){
  syncFullscreenControlsFromMain();

  const modal=document.querySelector('#graphFullscreen');
  modal.classList.add('open');
  modal.setAttribute('aria-hidden','false');
  document.body.classList.add('graph-fullscreen-open');

  const fsBotsList=document.querySelector('#fsBotsList');
  const fsBotsButton=document.querySelector('#fsBotsSummary');
  fsBotsList.hidden=true;
  fsBotsButton.setAttribute('aria-expanded','false');

  const fsEvents=document.querySelector('#fullscreenEvents');
  fsEvents.classList.add('collapsed');
  document.querySelector('#toggleFullscreenEvents').textContent='◀';

  requestAnimationFrame(buildFullscreenChart);
}

function closeGraphFullscreen(){
  const modal=document.querySelector('#graphFullscreen');
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden','true');
  document.body.classList.remove('graph-fullscreen-open');

  if(fullscreenChartInstance){
    fullscreenChartInstance.destroy();
    fullscreenChartInstance=null;
  }
}

document.querySelector('#openGraphFullscreen')
  .addEventListener('click',openGraphFullscreen);

document.querySelector('#closeGraphFullscreen')
  .addEventListener('click',closeGraphFullscreen);

document.querySelector('#fsBotsSummary')
  .addEventListener('click',()=>{
    const list=document.querySelector('#fsBotsList');
    const button=document.querySelector('#fsBotsSummary');
    const willOpen=list.hidden;

    list.hidden=!willOpen;
    button.setAttribute('aria-expanded',willOpen?'true':'false');
  });


document.querySelector('#toggleFullscreenEvents')
  .addEventListener('click',()=>{
    const panel=document.querySelector('#fullscreenEvents');
    panel.classList.toggle('collapsed');

    const collapsed=panel.classList.contains('collapsed');
    document.querySelector('#toggleFullscreenEvents').textContent=
      collapsed ? '◀' : '▼';

    setTimeout(()=>fullscreenChartInstance?.resize(),220);
  });

document.querySelector('#fullscreenResetZoom')
  .addEventListener('click',()=>{
    fullscreenChartInstance?.resetZoom?.();
  });

document.querySelector('#fullscreenEventsContent')
  .addEventListener('click',event=>{
    const link=event.target.closest('[data-go-event-date]');
    if(!link) return;

    const date=link.dataset.goEventDate;
    const cid=link.dataset.goEventCid;

    closeGraphFullscreen();

    const panel=document.querySelector('#eventsPanel');
    panel.open=true;

    const dateInput=document.querySelector('#eventDate');
    const botSelect=document.querySelector('#eventBot');

    dateInput.value=date;

    if([...botSelect.options].some(option=>option.value===cid)){
      botSelect.value=cid;
    }else{
      botSelect.value='';
    }

    loadEventForSelection();
    renderEvents();

    requestAnimationFrame(()=>{
      panel.scrollIntoView({behavior:'smooth',block:'start'});
    });
  });

document.querySelector('#fsDisplayMode')
  .addEventListener('change',e=>{
    document.querySelector('#displayMode').value=e.target.value;
    document.querySelector('#displayMode').dispatchEvent(
      new Event('change',{bubbles:true})
    );
    renderFullscreenBots();
    requestAnimationFrame(buildFullscreenChart);
  });

document.querySelector('#fsMetric')
  .addEventListener('change',e=>{
    document.querySelector('#compareMetric').value=e.target.value;
    drawCompareChart();
    requestAnimationFrame(buildFullscreenChart);
  });

document.querySelector('#fsPeriod')
  .addEventListener('change',e=>{
    document.querySelector('#comparePeriod').value=e.target.value;
    drawCompareChart();
    requestAnimationFrame(buildFullscreenChart);
  });

document.querySelector('#graphPanel')
  .addEventListener('toggle',()=>{
    if(document.querySelector('#graphPanel').open){
      setTimeout(()=>compareChart?.resize(),30);
    }
  });

// freezeOverviewRepair
document.querySelector('#compareBots')?.addEventListener('click',()=>{
  setTimeout(renderFreezeOverview,0);
});

restoreSiteSession();

</script>

</body>
</html>
